<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MARCA TYC | Z Automotiva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f5;--surface:#fff;--surface2:#fafafa;
  --text:#1a1a1a;--muted:#666;--soft:#999;
  --accent:#3483fa;--accent-dark:#2968c8;
  --green:#25d366;--border:#e6e6e6;
  --shadow:0 1px 2px rgba(0,0,0,.08);
  --shadow-hover:0 8px 24px rgba(0,0,0,.12);
  --radius:12px;--red:#d10000;
}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;display:flex;flex-direction:column}
a{color:inherit}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:var(--shadow);flex-shrink:0;gap:12px;position:sticky;top:0;z-index:200}
.topbar-left{display:flex;align-items:center;gap:12px;min-width:0}
.topbar-logo{height:36px;object-fit:contain}
.topbar-title{font-size:1.1rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-title span{color:var(--red)}
.topbar-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.data-gen{font-size:.75rem;color:var(--muted)}
.back-btn{text-decoration:none;font-size:.85rem;font-weight:600;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);transition:.15s}
.back-btn:hover{border-color:var(--accent);color:var(--accent)}

.toolbar{padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.busca-input{flex:1;min-width:200px;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:.95rem;outline:none;transition:.15s}
.busca-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(52,131,250,.15)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters select,.filters input{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:.85rem;background:var(--surface)}
.total-badge{font-size:.85rem;color:var(--muted);white-space:nowrap}

.main{display:grid;grid-template-columns:1fr 340px;flex:1;min-height:0;overflow:hidden}
.produtos-area{overflow-y:auto;padding:16px 20px}
.produtos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}

.prod-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s}
.prod-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.prod-card.hidden{display:none!important}
.prod-img{background:#fff;display:flex;align-items:center;justify-content:center;min-height:160px;padding:12px;border-bottom:1px solid var(--border)}
.prod-img img{max-width:100%;max-height:140px;object-fit:contain;opacity:0;transition:opacity .3s}
.prod-img img.loaded{opacity:1}
.prod-img.sem-img{background:var(--surface2)}
.no-img{font-size:.8rem;color:var(--soft)}
.prod-body{padding:12px;flex:1;display:flex;flex-direction:column;gap:6px}
.prod-desc{font-size:.85rem;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.prod-meta{font-size:.75rem;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.prod-meta b{color:var(--text)}
.prod-preco{font-size:1.25rem;font-weight:700;color:var(--accent);margin-top:auto}
.prod-preco.empty{color:var(--soft);font-size:.85rem;font-weight:500}

.prod-footer{display:flex;align-items:center;gap:0;border-top:1px solid var(--border);padding:10px 12px;background:var(--surface2)}
.qty-control{display:flex;align-items:center;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface)}
.qty-btn{width:32px;height:32px;border:none;background:transparent;font-size:1.1rem;cursor:pointer;color:var(--text)}
.qty-btn:hover{background:rgba(0,0,0,.04)}
.qty-num{min-width:36px;text-align:center;font-weight:700;font-size:.9rem}
.btn-add{flex:1;margin-left:8px;padding:10px 12px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;font-size:.85rem;cursor:pointer;transition:.15s}
.btn-add:hover{background:var(--accent-dark)}
.btn-add:active{transform:scale(.98)}

.skeleton .prod-img,.skeleton .prod-body>*{background:linear-gradient(90deg,#eee 25%,#f5f5f5 50%,#eee 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:6px;color:transparent}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

.cart-panel{background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.cart-header{padding:16px;border-bottom:1px solid var(--border)}
.cart-header h2{font-size:1rem;font-weight:700}
.cart-header p{font-size:.8rem;color:var(--muted);margin-top:4px}
.cart-count{color:var(--accent);font-weight:700}
.cart-list{flex:1;overflow-y:auto;padding:12px 16px}
.cart-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;color:var(--soft);text-align:center;padding:24px;font-size:.85rem}
.cart-item{display:flex;flex-direction:column;gap:4px;padding:10px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:var(--surface2)}
.cart-item-top{display:flex;align-items:center;gap:8px}
.cart-item-code{font-weight:800;font-size:.95rem;color:var(--accent);flex:1}
.cart-item-name{font-size:.75rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cart-footer{padding:14px 16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.btn-whats{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border:none;border-radius:10px;background:var(--green);color:#fff;font-weight:700;font-size:.95rem;cursor:pointer;transition:.15s}
.btn-whats:hover{filter:brightness(1.05)}
.btn-whats:disabled{opacity:.4;cursor:not-allowed}
.btn-clear{padding:10px;border:1px solid var(--border);border-radius:10px;background:transparent;color:var(--muted);font-weight:600;cursor:pointer}
.btn-clear:hover{border-color:var(--red);color:var(--red)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:#323232;color:#fff;padding:12px 20px;border-radius:10px;font-size:.9rem;font-weight:600;opacity:0;transition:.25s;z-index:9999;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:#1e7e34}

.pagination-bar{display:flex;justify-content:center;align-items:center;gap:8px;padding:16px;flex-wrap:wrap}
.pagination-bar button{padding:8px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);cursor:pointer;font-weight:600}
.pagination-bar button:disabled{opacity:.4;cursor:not-allowed}
.pagination-bar button.active{background:var(--accent);color:#fff;border-color:var(--accent)}

@media(max-width:900px){
  .main{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .cart-panel{border-left:none;border-top:1px solid var(--border);max-height:45vh}
  .produtos-area{max-height:55vh}
}

.catalogos-nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;padding:14px 20px;background:#fff;border-bottom:1px solid var(--border)}
.catalogo-link{text-decoration:none;border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--surface2);display:flex;flex-direction:column;gap:4px;transition:.15s}
.catalogo-link:hover{border-color:var(--accent);box-shadow:var(--shadow-hover);transform:translateY(-1px)}
.catalogo-link strong{font-size:.9rem;color:var(--text)}
.catalogo-link span{font-size:.76rem;color:var(--muted)}
.catalogo-link.erro{border-color:#f3b5b5;background:#fff7f7}
</style>
</head>

</div>

<script>/**
 * Shopping cart with localStorage persistence (browser).
 */
(function (global) {
  const STORAGE_PREFIX = 'zautomotiva_cart_';

  function storageKey(catalogId) {
    return STORAGE_PREFIX + String(catalogId || 'default');
  }

  function load(catalogId) {
    try {
      const raw = localStorage.getItem(storageKey(catalogId));
      return raw ? JSON.parse(raw) : [];
    } catch {
      return [];
    }
  }

  function save(catalogId, items) {
    try {
      localStorage.setItem(storageKey(catalogId), JSON.stringify(items));
    } catch {
      /* quota / private mode */
    }
  }

  function lineKey(item) {
    return `${item.marca || ''}|${item.cod || ''}|${item.codFab || ''}|${item.nome || ''}`;
  }

  function add(catalogId, product, qty = 1) {
    const items = load(catalogId);
    const key = lineKey(product);
    const existing = items.find((i) => lineKey(i) === key);
    if (existing) {
      existing.qty += qty;
    } else {
      items.unshift({
        cod: product.cod,
        codFab: product.codFab,
        nome: product.nome,
        marca: product.marca,
        catalogo: product.catalogo,
        catalogoId: product.catalogoId,
        qty: Math.max(1, qty),
      });
    }
    save(catalogId, items);
    return items;
  }

  function setQty(catalogId, index, qty) {
    const items = load(catalogId);
    if (index < 0 || index >= items.length) return items;
    if (qty <= 0) items.splice(index, 1);
    else items[index].qty = qty;
    save(catalogId, items);
    return items;
  }

  function remove(catalogId, index) {
    const items = load(catalogId);
    items.splice(index, 1);
    save(catalogId, items);
    return items;
  }

  function clear(catalogId) {
    save(catalogId, []);
    return [];
  }

  function totalPieces(items) {
    return items.reduce((s, i) => s + (i.qty || 0), 0);
  }

  function displayCode(item) {
    if (item.cod && item.codFab) return `${item.cod} / ${item.codFab}`;
    return item.cod || item.codFab || '—';
  }

  function buildWhatsAppMessage(items) {
    const lines = ['Olá, gostaria de solicitar:', ''];
    items.forEach((item) => {
      lines.push(`${item.qty}x ${displayCode(item)}${item.nome ? ` - ${item.nome}` : ''}${item.marca ? ` (${item.marca})` : ''}`);
    });
    lines.push('');
    lines.push(`Total de itens: ${totalPieces(items)}`);
    return lines.join('\n');
  }

  global.ZCart = {
    load,
    save,
    add,
    setQty,
    remove,
    clear,
    totalPieces,
    displayCode,
    buildWhatsAppMessage,
    storageKey,
  };
})(typeof window !== 'undefined' ? window : global);
</script>
<script>/**
 * Catalog UI: search, filters, sort, pagination, cart integration.
 */
(function () {
  const cfg = window.CATALOG_CONFIG || {};
  const catalogId = cfg.id || 'default';
  const PAGE_SIZE = cfg.pageSize || 24;

  const els = {
    grid: document.getElementById('produtosGrid'),
    busca: document.getElementById('buscaInput'),
    marcaFilter: document.getElementById('filterMarca'),
    precoMin: document.getElementById('filterPrecoMin'),
    precoMax: document.getElementById('filterPrecoMax'),
    sort: document.getElementById('filterSort'),
    totalBadge: document.getElementById('totalBadge'),
    cartList: document.getElementById('cartList'),
    cartEmpty: document.getElementById('cartEmpty'),
    cartTitle: document.getElementById('cartTitle'),
    cartTotal: document.getElementById('cartTotal'),
    btnWhats: Array.from(document.querySelectorAll('[data-whats-index]')),
    btnClear: document.getElementById('btnClear'),
    toast: document.getElementById('toast'),
    pagination: document.getElementById('paginationBar'),
  };

  let products = [];
  let filtered = [];
  let currentPage = 1;
  let toastTimer;

  function debounce(fn, ms) {
    let t;
    return (...args) => {
      clearTimeout(t);
      t = setTimeout(() => fn(...args), ms);
    };
  }

  function showToast(msg, ok) {
    if (!els.toast) return;
    els.toast.textContent = msg;
    els.toast.className = 'toast show' + (ok ? ' ok' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => els.toast.classList.remove('show'), 2400);
  }

  function parsePreco(p) {
    if (p?.precoNum != null) return p.precoNum;
    if (!p?.preco) return null;
    const s = String(p.preco).replace(/[^\d,.-]/g, '').replace(/\./g, '').replace(',', '.');
    const n = parseFloat(s);
    return Number.isFinite(n) ? n : null;
  }

  function populateMarcaFilter() {
    if (!els.marcaFilter) return;
    const marcas = [...new Set(products.map((p) => p.marca).filter(Boolean))].sort();
    els.marcaFilter.innerHTML =
      '<option value="">Todas as marcas</option>' +
      marcas.map((m) => `<option value="${escapeAttr(m)}">${escapeHtml(m)}</option>`).join('');
  }

  function escapeHtml(s) {
    return String(s ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function escapeAttr(s) {
    return escapeHtml(s).replace(/'/g, '&#39;');
  }

  function applyFilters() {
    const q = (els.busca?.value || '').toLowerCase().trim();
    const marca = els.marcaFilter?.value || '';
    const min = els.precoMin?.value ? parseFloat(els.precoMin.value) : null;
    const max = els.precoMax?.value ? parseFloat(els.precoMax.value) : null;
    const sort = els.sort?.value || '';

    filtered = products.filter((p) => {
      const hay = (p.searchText || `${p.nome} ${p.desc} ${p.cod} ${p.codFab} ${p.marca} ${p.catalogo}`).toLowerCase();
      if (q && !hay.includes(q)) return false;
      if (marca && p.marca !== marca) return false;
      const price = parsePreco(p);
      if (min != null && price != null && price < min) return false;
      if (max != null && price != null && price > max) return false;
      return true;
    });

    filtered.sort((a, b) => {
      const pa = parsePreco(a) ?? 0;
      const pb = parsePreco(b) ?? 0;
      const na = (a.nome || '').toLowerCase();
      const nb = (b.nome || '').toLowerCase();
      switch (sort) {
        case 'price-asc':
          return pa - pb;
        case 'price-desc':
          return pb - pa;
        case 'name-desc':
          return nb.localeCompare(na);
        case 'name-asc':
        default:
          return na.localeCompare(nb);
      }
    });

    currentPage = 1;
    render();
  }

  function productKey(p) {
    return `${p.catalogoId || catalogId}|${p.marca || ''}|${p.cod || ''}|${p.codFab || ''}|${p.nome || ''}`;
  }

  function renderCard(p) {
    const key = productKey(p);
    const preco = p.preco || (p.precoNum != null ? `R$ ${p.precoNum.toFixed(2).replace('.', ',')}` : '');
    const img = p.imgSrc || '';
    return `
      <article class="prod-card" data-product-key="${escapeAttr(key)}"
        data-cod="${escapeAttr(p.cod)}" data-cod-fab="${escapeAttr(p.codFab)}"
        data-nome="${escapeAttr(p.nome)}" data-marca="${escapeAttr(p.marca)}">
        <div class="prod-img${img ? '' : ' sem-img'}">
          ${img ? `<img src="${escapeAttr(img)}" alt="" loading="lazy" decoding="async">` : '<span class="no-img">Sem imagem</span>'}
        </div>
        <div class="prod-body">
          <div class="prod-desc">${escapeHtml(p.nome)}</div>
          <div class="prod-meta">
            ${p.catalogo ? `<span>Catálogo: <b>${escapeHtml(p.catalogo)}</b></span>` : ''}
            ${p.marca ? `<span>Marca: <b>${escapeHtml(p.marca)}</b></span>` : ''}
            ${p.cod ? `<span>Código: <b>${escapeHtml(p.cod)}</b></span>` : ''}
            ${p.codFab ? `<span>Cód. fab.: <b>${escapeHtml(p.codFab)}</b></span>` : ''}
          </div>
          <div class="prod-preco${preco ? '' : ' empty'}">${preco || 'Consulte'}</div>
        </div>
        <div class="prod-footer">
          <div class="qty-control" role="group" aria-label="Quantidade">
            <button type="button" class="qty-btn" data-action="minus" aria-label="Diminuir">−</button>
            <span class="qty-num">1</span>
            <button type="button" class="qty-btn" data-action="plus" aria-label="Aumentar">+</button>
          </div>
          <button type="button" class="btn-add">Adicionar</button>
        </div>
      </article>`;
  }

  function render() {
    const total = filtered.length;
    const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if (currentPage > pages) currentPage = pages;

    const start = (currentPage - 1) * PAGE_SIZE;
    const slice = filtered.slice(start, start + PAGE_SIZE);

    if (els.totalBadge) {
      els.totalBadge.textContent = `${total} produto${total !== 1 ? 's' : ''}`;
    }

    if (!els.grid) return;

    if (!total) {
      els.grid.innerHTML = '<p class="cart-empty">Nenhum produto encontrado.</p>';
    } else {
      els.grid.innerHTML = slice.map(renderCard).join('');
      els.grid.querySelectorAll('.prod-img img').forEach((img) => {
        const onLoad = () => img.classList.add('loaded');
        if (img.complete) onLoad();
        else {
          img.addEventListener('load', onLoad, { once: true });
          img.addEventListener('error', () => {
            img.style.display = 'none';
            img.parentElement?.classList.add('sem-img');
          }, { once: true });
        }
      });
    }

    renderPagination(pages);
    renderCart();
  }

  function renderPagination(pages) {
    if (!els.pagination) return;
    if (pages <= 1) {
      els.pagination.innerHTML = '';
      return;
    }

    const btns = [];
    btns.push(`<button type="button" data-page="prev" ${currentPage <= 1 ? 'disabled' : ''}>‹</button>`);

    const windowSize = 5;
    let start = Math.max(1, currentPage - 2);
    let end = Math.min(pages, start + windowSize - 1);
    start = Math.max(1, end - windowSize + 1);

    for (let i = start; i <= end; i++) {
      btns.push(
        `<button type="button" data-page="${i}" class="${i === currentPage ? 'active' : ''}">${i}</button>`
      );
    }

    btns.push(`<button type="button" data-page="next" ${currentPage >= pages ? 'disabled' : ''}>›</button>`);
    els.pagination.innerHTML = btns.join('');
  }

  function renderCart() {
    const items = window.ZCart.load(catalogId);
    const pieces = window.ZCart.totalPieces(items);

    if (els.cartTitle) {
      els.cartTitle.textContent = `Carrinho (${pieces} ${pieces === 1 ? 'item' : 'itens'})`;
    }

    if (els.cartTotal) {
      els.cartTotal.textContent = pieces
        ? items.map((i) => `${i.qty}x ${window.ZCart.displayCode(i)}`).join(' · ')
        : '';
    }

    if (!els.cartList) return;

    if (!items.length) {
      els.cartList.innerHTML = '';
      if (els.cartEmpty) els.cartEmpty.style.display = 'flex';
      els.btnWhats.forEach((btn) => { btn.disabled = true; });
      return;
    }

    if (els.cartEmpty) els.cartEmpty.style.display = 'none';
    els.btnWhats.forEach((btn) => { btn.disabled = false; });

    els.cartList.innerHTML = items
      .map(
        (item, idx) => `
      <div class="cart-item" data-idx="${idx}">
        <div class="cart-item-top">
          <span class="cart-item-code">${escapeHtml(window.ZCart.displayCode(item))}</span>
          <div class="qty-control">
            <button type="button" class="qty-btn" data-cart-action="minus" data-idx="${idx}">−</button>
            <span class="qty-num">${item.qty}</span>
            <button type="button" class="qty-btn" data-cart-action="plus" data-idx="${idx}">+</button>
          </div>
          <button type="button" class="qty-btn" data-cart-action="remove" data-idx="${idx}" aria-label="Remover">×</button>
        </div>
        ${item.nome ? `<div class="cart-item-name">${escapeHtml(item.nome)}</div>` : ''}
      </div>`
      )
      .join('');
  }

  function bindEvents() {
    const debouncedFilter = debounce(applyFilters, 280);
    els.busca?.addEventListener('input', debouncedFilter);
    els.marcaFilter?.addEventListener('change', applyFilters);
    els.precoMin?.addEventListener('input', debouncedFilter);
    els.precoMax?.addEventListener('input', debouncedFilter);
    els.sort?.addEventListener('change', applyFilters);

    els.grid?.addEventListener('click', (e) => {
      const card = e.target.closest('.prod-card');
      if (!card) return;

      const key = card.dataset.productKey;
      const product = products.find((p) => productKey(p) === key);
      if (!product) return;

      if (e.target.closest('.qty-btn')) {
        const action = e.target.dataset.action;
        const numEl = card.querySelector('.qty-num');
        let n = parseInt(numEl.textContent, 10) || 1;
        if (action === 'plus') n = Math.min(99, n + 1);
        if (action === 'minus') n = Math.max(1, n - 1);
        numEl.textContent = String(n);
        return;
      }

      if (e.target.closest('.btn-add')) {
        const qty = parseInt(card.querySelector('.qty-num')?.textContent || '1', 10) || 1;
        window.ZCart.add(catalogId, product, qty);
        renderCart();
        showToast(`${window.ZCart.displayCode(product)} adicionado`, true);
      }
    });

    els.cartList?.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-cart-action]');
      if (!btn) return;
      const idx = parseInt(btn.dataset.idx, 10);
      const items = window.ZCart.load(catalogId);
      const item = items[idx];
      if (!item) return;

      if (btn.dataset.cartAction === 'remove') {
        window.ZCart.remove(catalogId, idx);
      } else if (btn.dataset.cartAction === 'plus') {
        window.ZCart.setQty(catalogId, idx, item.qty + 1);
      } else if (btn.dataset.cartAction === 'minus') {
        window.ZCart.setQty(catalogId, idx, item.qty - 1);
      }
      renderCart();
    });

    els.btnClear?.addEventListener('click', () => {
      window.ZCart.clear(catalogId);
      renderCart();
      showToast('Carrinho limpo');
    });

    els.btnWhats.forEach((btn) => {
      btn.addEventListener('click', () => {
        const items = window.ZCart.load(catalogId);
        if (!items.length) return;

        const idx = Number(btn.dataset.whatsIndex || 0);
        const vendedores = Array.isArray(cfg.vendedores) ? cfg.vendedores : [];
        const vendedor = vendedores[idx] || {};
        if (vendedor.nome) btn.textContent = `Enviar para ${vendedor.nome}`;
        const numero = String(vendedor.whatsapp || '').replace(/\D/g, '');

        if (!numero) {
          showToast('Número do WhatsApp não configurado');
          return;
        }

        const msg = window.ZCart.buildWhatsAppMessage(items);
        const url = `https://wa.me/${numero}?text=${encodeURIComponent(msg)}`;
        window.open(url, '_blank');
      });
    });

    els.pagination?.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-page]');
      if (!btn || btn.disabled) return;
      const pages = Math.ceil(filtered.length / PAGE_SIZE);
      const p = btn.dataset.page;
      if (p === 'prev') currentPage = Math.max(1, currentPage - 1);
      else if (p === 'next') currentPage = Math.min(pages, currentPage + 1);
      else currentPage = parseInt(p, 10);
      render();
      document.querySelector('.produtos-area')?.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

  function init() {
    const dataEl = document.getElementById('catalog-data');
    if (dataEl) {
      try {
        products = JSON.parse(dataEl.textContent);
      } catch {
        products = [];
      }
    }
    filtered = [...products];
    els.btnWhats.forEach((btn) => {
      const idx = Number(btn.dataset.whatsIndex || 0);
      const vendedor = Array.isArray(cfg.vendedores) ? cfg.vendedores[idx] : null;
      if (vendedor?.nome) btn.textContent = `Enviar para ${vendedor.nome}`;
    });
    populateMarcaFilter();
    bindEvents();
    applyFilters();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
